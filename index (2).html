<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
    <title>Kolekta Prototype</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <script>
      /* Lock the app height once so the on-screen keyboard cannot resize the layout */
      (function(){var w=innerWidth;function s(){document.documentElement.style.setProperty("--app-h",innerHeight+"px");w=innerWidth}s();addEventListener("resize",function(){if(innerWidth!==w)s()})})();
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <main id="app"></main>
    <script src="js/state.js"></script>
    <script src="js/images.js"></script>
    <script src="js/views.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/assignee.js"></script>
    <script src="js/maps.js"></script>
    <script src="js/barangay-map-page.js"></script>
    <script src="js/sample-data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
