<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kolekta</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1f10;--card:#16301a;--c2:#1e3f23;--line:#2c5a33;--lime:#c5f76b;--btn:#4f7a2a;--tx:#eaf5e2;--mut:#8fb08a;--amb:#f0b86e;--red:#ff8b7b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050c06;color:var(--tx);font:400 14px/1.45 Poppins,system-ui,sans-serif}
#app{max-width:360px;height:100%;max-height:800px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:400px){#app{height:min(800px,calc(100% - 32px));margin-top:16px;border-radius:28px;border:2px solid #cfd8cf}}
.body{flex:1;overflow-y:auto;padding:4px 18px 20px}header{padding:18px 18px 8px}h1{font-size:22px;margin:0;font-weight:600}h2{font-size:15px;margin:16px 0 8px;font-weight:600}header p,.mut{color:var(--mut);font-size:12px;margin:2px 0 0}
a{color:var(--lime);cursor:pointer;text-decoration:underline}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px}.card.dim{opacity:.55}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:11px;font-weight:500;border-radius:20px;padding:2px 10px;background:var(--lime);color:#173a12;white-space:nowrap}.pill.n{background:var(--amb)}.pill.r{background:#b9c7b4}.pill.x{background:#2c5a33;color:var(--mut)}.pill.bad{background:var(--red)}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{width:100%;background:var(--btn);border:0;border-radius:24px;padding:12px;font-weight:600;cursor:pointer;margin-top:10px}.btn:hover{background:#5d8c32}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;background:var(--card);border:0;border-radius:10px;padding:9px 4px;font-size:12px;cursor:pointer}.seg button.on{background:var(--lime);color:#173a12;font-weight:600}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 8px}textarea{resize:vertical;min-height:70px}
label{font-size:12px;font-weight:500}:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
nav{display:flex;background:#0a1a0c;border-top:1px solid var(--line)}nav button{flex:1;background:none;border:0;padding:14px 4px;color:var(--mut);font-size:12px;cursor:pointer}nav button.on{color:var(--lime);font-weight:600}
.err{color:var(--red);font-size:12px;margin:-4px 0 8px}.back{background:#e6efe1;color:#10260f;border:0;border-radius:20px;font-size:11px;font-weight:600;padding:3px 10px;margin:14px 18px 0;cursor:pointer;width:max-content}
.map{height:130px;border-radius:10px;border:1px solid var(--line);position:relative;cursor:crosshair;background:repeating-linear-gradient(90deg,#1b3d20 0 1px,transparent 1px 22px),repeating-linear-gradient(0deg,#1b3d20 0 1px,transparent 1px 22px),#123016}
.dot{position:absolute;width:16px;height:16px;background:var(--lime);border:3px solid #173a12;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg)}
.ph{display:flex;gap:8px;margin:6px 0 10px}.ph>*{flex:1;aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:12px;color:var(--mut);cursor:pointer;overflow:hidden;position:relative}.ph img{width:100%;height:100%;object-fit:cover}
.banner{background:var(--lime);color:#173a12;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:13px}
.toast{position:absolute;left:18px;right:18px;bottom:70px;background:var(--lime);color:#173a12;border-radius:12px;padding:10px 14px;font-weight:500;text-align:center}
.hero{padding:70px 24px 24px}.hero h1{font-size:34px;letter-spacing:1px}
</style></head><body><div id="app"></div>
<script>
const B=['Tibanga','Poblacion','Pala-o','Hinaplanon','Saray'],D=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],T=['Collection','No collection'],ST=['Submitted','In Progress','Resolved','Rejected'];
const acc=b=>b.toLowerCase().replace('-','');
const now=()=>new Date().toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'});
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t12=t=>{let[h,m]=t.split(':');h=+h;return`${h%12||12}:${m} ${h<12?'AM':'PM'}`};
const S={screen:'welcome',tab:'home',name:'',brgy:'',off:null,fails:0,locked:{},sel:null,filter:'All',seq:0,err:{},ann:[],rep:[],toast:'',chk:'',chkRes:null,done:null,d:null,ed:null,ak:'Urgent',sched:{}};
const SD={Tibanga:['','Purok 10 to Purok 3','','Purok 21','Purok 16 to Purok 12',''],Poblacion:['Zone 1–5','Zone 6–10','Zone 1–5','Zone 6–10','Zone 1–5','Zone 6–10'],'Pala-o':['Purok 1, 2, 3, 4, 11','Purok 13, 13a, 14a','Purok 17, 18, 19','Purok 6, 7, 15','',''],Hinaplanon:['Purok 1, 2, 3','Purok 4, 5, 6','Purok 7, 8, 9','Purok 10, 11, 12','Purok 13, 14, 15',''],Saray:['Purok 1, 2, 3, 3a, 4, 5, 6','','','Purok 9, 10, 10a','','']};
B.forEach(b=>{S.sched[b]=D.map((_,i)=>({type:(SD[b][i]||(b=='Tibanga'&&i==3))?'Collection':'No collection',time:'',route:SD[b][i],delay:''}));
S.ann.push({b,k:'Urgent',title:'No collection today: truck breakdown',msg:'The garbage truck is being repaired. Collection resumes tomorrow.',date:'Nov 5, 2026',ts:2},{b,k:'Reminder',title:'No segregation, no collection',msg:'Please separate your waste before putting it out.',date:'Nov 3, 2026',ts:1})});
const $=s=>document.querySelector(s),R=()=>{$('#app').innerHTML=V[S.screen]()+(S.toast?`<div class="toast" role="status">${E(S.toast)}</div>`:'')},go=s=>{S.screen=s;S.err={};R()};
const tst=m=>{S.toast=m;R();setTimeout(()=>{S.toast='';R()},2200)};
const pc=t=>t=='Collection'?'':'x';
const head=(h,p)=>`<header><h1>${h}</h1><p>${p||''}</p></header>`;
const nav=(a,c)=>`<nav>${a.map(([k,l])=>`<button class="${k==c?'on':''}" onclick="if(S.editing)cancelEdit();S.tab='${k}';S.sel=null;S.done=null;S.chkRes=null;R()">${l}</button>`).join('')}</nav>`;
const er=k=>S.err[k]?`<div class="err" role="alert">${E(S.err[k])}</div>`:'';
const shell=(a,body)=>`${body}${nav(a,S.tab)}`;
const RN=[['home','Home'],['news','News'],['report','Report'],['guide','Sort guide']],ON=[['sched','Schedule'],['ann','Announce'],['reps','Reports']];
const mapView=(p,click)=>`<div class="map" ${click?'onclick="pin(event)"':''} role="img" aria-label="Map">${p?`<div class="dot" style="left:${p.x}%;top:${p.y}%"></div>`:''}</div>`;
const coords=p=>`${(8.2280+(50-p.y)*0.0004).toFixed(5)}, ${(124.2450+(p.x-50)*0.0004).toFixed(5)}`;
const V={
welcome:()=>`<div class="hero"><h1>Kolekta</h1><p class="mut">Garbage collection schedule, citizen reports and drainage monitoring</p><h2 style="margin-top:44px;font-size:20px">Welcome!</h2><p class="mut">Who is using the app today?</p><button class="btn" onclick="go('setup')">I am a Resident</button><button class="btn" onclick="go('login')">I am a Barangay Official</button></div>`,
setup:()=>`<button class="back" onclick="go('welcome')">BACK</button>${head('Let’s get you set up','Tell us who you are')}<div class="body"><label for=n>Your name</label><input id=n placeholder="Enter your name" value="${E(S.name)}" oninput="S.name=this.value">${er('name')}<label for=b>Your barangay</label><select id=b onchange="S.brgy=this.value"><option value="">Select barangay</option>${B.map(b=>`<option ${b==S.brgy?'selected':''} value="${b}">Barangay ${b}</option>`).join('')}</select>${er('brgy')}<button class="btn" onclick="cont()">Continue</button></div>`,
home:()=>{const s=S.sched[S.brgy],a=S.ann.filter(x=>x.b==S.brgy)[0];return shell(RN,`<button class="back" onclick="go('setup')">BACK</button>`+head(`Hello, ${E(S.name)}!`,`Barangay ${S.brgy}`)+`<div class="body">${s.map((x,i)=>({...x,day:D[i]})).filter(x=>x.delay).map(x=>`<div class="banner"><b>Delay notice, ${x.day||''}</b> ${E(x.delay)}</div>`).join('')}<h2>Weekly collection schedule</h2>${s.every(x=>x.type=='No collection')?'<p class="mut">No schedule is available yet.</p>':s.map((x,i)=>i==5&&x.type=='No collection'?'':`<div class="card row ${x.type=='No collection'?'dim':''}"><div><b>${D[i]}</b><div class="mut">${x.type=='No collection'?'—':E(x.route||'Route to be confirmed')+(x.time?', '+t12(x.time):'')}</div>${x.delay?`<div style="color:var(--amb);font-size:12px">Delayed: ${E(x.delay)}</div>`:''}</div><span class="pill ${pc(x.type)}">${x.type}</span></div>`).join('')}${a?`<div class="banner"><b>Latest announcement</b><br>${E(a.title)}</div>`:''}</div>`)},
news:()=>{const it=[...S.ann.filter(x=>x.b==S.brgy),...S.rep.filter(r=>r.b==S.brgy&&r.status!='Submitted').map(r=>({k:'Report',title:`Report ${r.ref}: ${r.status}`,msg:r.status=='Rejected'?`Reason: ${r.reason}`:`Action: ${r.action}`,date:r.upd,ts:r.ts}))].sort((a,b)=>b.ts-a.ts);const c=S.chkRes;
return shell(RN,head('Announcements',`Barangay ${S.brgy}`)+`<div class="body"><div class="card"><label for=rf>Check a report status</label><input id=rf placeholder="e.g. KOL-2026-001" value="${E(S.chk)}" oninput="S.chk=this.value"><button class="btn" style="margin-top:0" onclick="chk()">Check status</button>${c==='none'?'<div class="err" style="margin:8px 0 0">Reference number not found. Check it and try again.</div>':c?`<p style="margin:10px 0 0"><span class="pill ${c.status=='Rejected'?'bad':c.status=='Resolved'?'':'n'}">${c.status}</span> <b>${E(c.type)}</b><br><span class="mut">Updated ${c.upd}${c.action?`. Action: ${E(c.action)}`:''}${c.reason?`. Reason: ${E(c.reason)}`:''}</span></p>`:''}</div>${it.length?it.map(x=>`<div class="card"><div class="row"><span class="pill ${x.k=='Urgent'?'bad':x.k=='Notice'?'n':x.k=='Report'?'r':''}">${x.k}</span><span class="mut">${x.date}</span></div><b>${E(x.title)}</b><div class="mut">${E(x.msg)}</div></div>`).join(''):'<p class="mut">No announcements yet.</p>'}</div>`)},
report:()=>{if(S.done){const r=S.done;return shell(RN,head('Report submitted','Thank you for helping keep our barangay clean')+`<div class="body"><div class="card"><div class="mut">Your reference number</div><h1 style="color:var(--lime)">${r.ref}</h1><div class="mut">${r.date}. Status: Submitted</div><p>Keep this number. Use it on the News page to check your report status.</p></div><button class="btn" onclick="S.done=null;R()">Done</button></div>`)}
const d=S.d||(S.d={type:'Missed collection',date:'',desc:'',pin:null,ph:[]}),m=d.type=='Missed collection';
return shell(RN,head('Report a problem','Help keep our barangay clean')+`<div class="body"><div class="seg"><button class="${m?'on':''}" onclick="S.d.type='Missed collection';R()">Missed Collection</button><button class="${m?'':'on'}" onclick="S.d.type='Clogged canal';R()">Clogged drainage</button></div><div class="mut" style="margin-bottom:6px">Reporting for Barangay ${S.brgy}. We save this barangay, your description, the pinned location and any photo. No name or contact number is collected.</div>${m?`<label for=dt>Date missed</label><input id=dt type=date value="${d.date}" oninput="S.d.date=this.value">${er('date')}`:''}<label>Photo evidence <span class=mut>(optional, up to 3, JPG or PNG, 5 MB each)</span></label><div class="ph">${[0,1,2].map(i=>d.ph[i]?`<div onclick="S.d.ph.splice(${i},1);R()" title="Remove photo"><img src="${d.ph[i]}" alt="Attached photo ${i+1}"></div>`:`<div onclick="$('#pf').click()">+ Add</div>`).join('')}</div><input id=pf type=file accept="image/jpeg,image/png" multiple hidden onchange="addPh(this)">${er('ph')}<label>Pin the location <span class=mut>(required)</span></label>${mapView(d.pin,1)}<div class="mut" style="margin:4px 0 8px">${d.pin?`Pinned at ${coords(d.pin)}. Tap to move.`:'Tap the map to drop a pin'}</div>${er('pin')}<label for=ds>Description</label><textarea id=ds placeholder="What is the problem?" oninput="S.d.desc=this.value">${E(d.desc)}</textarea>${er('desc')}<button class="btn" onclick="sub()">Submit report</button></div>`)},
guide:()=>shell(RN,head('How to sort your garbage','Segregate before collection')+`<div class="body"><div class="banner"><b>No segregation, no collection</b><br>Unsorted garbage will not be collected.</div>${[['Biodegradable','Green bin','Food scraps, fruit and vegetable peels, leaves, grass, eggshells, paper',''],['Non-biodegradable','Black bin','Plastic wrappers, bottles, cans, styrofoam, glass, rubber, diapers','n'],['Residual','Gray bin','Items that cannot be recycled or composted, such as sanitary waste','r']].map(x=>`<div class="card"><div class="row"><b>${x[0]}</b><span class="pill ${x[3]}">${x[1]}</span></div><div class="mut">${x[2]}</div></div>`).join('')}<div class="card"><b>Quick tips</b><div class="mut">1. Keep separate bags.<br>2. Rinse containers before disposal.<br>3. Tie bags and set them out on your collection day.</div></div></div>`),
login:()=>`<button class="back" onclick="go('welcome')">BACK</button><div class="hero" style="padding-top:40px"><h1 style="font-size:24px">Barangay Official</h1><p class="mut">Sign in to manage Kolekta</p><div style="margin-top:30px"><label for=u>Username</label><input id=u autocomplete=username><label for=p>Password</label><input id=p type=password autocomplete=current-password>${er('login')}<button class="btn" onclick="login()">Log in</button><p class="mut" style="text-align:center;margin-top:12px">Authorized officials only</p><p class="mut" style="text-align:center">Demo account: username is your barangay in lowercase without hyphens (tibanga, poblacion, palao, hinaplanon, saray), password kolekta2026</p></div></div>`,
sched:()=>{const s=S.sched[S.off];if(!S.editing)return shell(ON,head('Current schedule',`Barangay ${S.off}: set by the barangay`)+`<div class="body">${schedList(s)}<button class="btn" onclick="startEdit()">Edit schedule</button></div>`);return shell(ON,head('Set collection',`Barangay ${S.off}: weekly schedule and route`)+`<div class="body">${s.map((x,i)=>`<div class="card"><b>${D[i]}</b><select aria-label="${D[i]} waste type" onchange="S.sched[S.off][${i}].type=this.value">${T.map(t=>`<option ${t==x.type?'selected':''}>${t}</option>`).join('')}</select><div class="row"><div style="flex:1"><label>Time (optional)</label><input type=time value="${x.time}" oninput="S.sched[S.off][${i}].time=this.value"></div><div style="flex:2"><label>Purok / zones</label><input value="${E(x.route)}" placeholder="e.g. Purok 1–3" oninput="S.sched[S.off][${i}].route=this.value"></div></div><label>Delay notice <span class=mut>(optional)</span></label><input value="${E(x.delay)}" placeholder="e.g. Truck delayed until 10:00 AM" oninput="S.sched[S.off][${i}].delay=this.value">${er('s'+i)}</div>`).join('')}<button class="btn" onclick="saveS()">Save schedule</button><button class="btn" style="background:var(--card)" onclick="cancelEdit()">Cancel</button></div>`)},
ann:()=>shell(ON,head('Post announcement','Residents of your barangay are notified instantly')+`<div class="body"><div class="seg">${['Urgent','Notice','Reminder'].map(k=>`<button class="${S.ak==k?'on':''}" onclick="S.ak='${k}';R()">${k}</button>`).join('')}</div><label for=at>Title</label><input id=at placeholder="e.g. No collection today">${er('t')}<label for=am>Message</label><textarea id=am placeholder="e.g. Garbage truck broke down. Collection resumes tomorrow."></textarea>${er('m')}<button class="btn" onclick="post()">Post announcement</button><h2>Recent posts</h2>${S.ann.filter(x=>x.b==S.off).sort((a,b)=>b.ts-a.ts).map(x=>`<div class="card row"><span>${E(x.title)}</span><span class="mut">${x.date}</span></div>`).join('')}</div>`),
reps:()=>{const L=S.rep.filter(r=>r.b==S.off),r=L.find(x=>x.ref==S.sel);if(r){const e=S.ed;return`<button class="back" onclick="S.sel=null;R()">BACK</button>${head(r.ref,`${r.type}, ${r.date}`)}<div class="body"><div class="card">${r.type=='Missed collection'?`<div class="mut">Date missed: ${r.dm}</div>`:''}<p style="margin:6px 0">${E(r.desc)}</p>${mapView(r.pin)}<div class="mut">Pin: ${coords(r.pin)}</div>${r.ph.length?`<div class="ph">${r.ph.map(u=>`<div><img src="${u}" alt="Evidence photo"></div>`).join('')}</div>`:'<div class="mut">No photo attached</div>'}</div><label for=ac>Local action taken (or referral to the LGU, recorded here)</label><textarea id=ac oninput="S.ed.action=this.value">${E(e.action)}</textarea>${er('a')}<label for=st>Status</label><select id=st onchange="S.ed.status=this.value;R()">${ST.map(s=>`<option ${s==e.status?'selected':''}>${s}</option>`).join('')}</select>${e.status=='Rejected'?`<label for=rs>Reason for rejecting</label><input id=rs value="${E(e.reason)}" oninput="S.ed.reason=this.value">${er('r')}`:''}<button class="btn" onclick="saveR()">Update status</button></div>`}
return shell(ON,head('Citizen reports',`Barangay ${S.off}. Updates are shown to residents`)+`<div class="body"><div class="seg" style="flex-wrap:wrap">${['All',...ST].map(f=>`<button style="flex:none;padding:7px 10px" class="${S.filter==f?'on':''}" onclick="S.filter='${f}';R()">${f}</button>`).join('')}</div>${L.filter(x=>S.filter=='All'||x.status==S.filter).sort((a,b)=>b.ts-a.ts).map(x=>`<div class="card" style="cursor:pointer" onclick="S.sel='${x.ref}';S.ed={status:x.status,action:x.action||'',reason:x.reason||''};R()"><div class="row"><b>${x.type}</b><span class="pill ${x.status=='Rejected'?'bad':x.status=='Resolved'?'':'n'}">${x.status}</span></div><div class="mut">${x.ref}, ${x.date}</div></div>`).join('')||'<p class="mut">No reports to show.</p>'}</div>`)}};
function cont(){S.err={};if(!S.name.trim())S.err.name='Enter your name.';if(!S.brgy)S.err.brgy='Select your barangay.';if(Object.keys(S.err).length)return R();S.tab='home';S.screen='res';V.res=V.home;go('home_')}
V.home_=()=>V[S.tab]();
function login(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,b=B.find(b=>acc(b)==u);S.err={};
if(b&&S.locked[u])S.err.login='This account is blocked after 5 failed attempts. Contact the person who issued the account.';
else if(b&&p=='kolekta2026'){S.off=b;S.tab='sched';S.fails=0;return go('off_')}
else{if(b){S.fails=(S.fails||0)+1;if(S.fails>=5)S.locked[u]=1}S.err.login='Invalid username or password.'}R();$('#u').value=u}
V.off_=()=>V[S.tab]();
function chk(){const r=S.rep.find(x=>x.ref.toLowerCase()==S.chk.trim().toLowerCase());S.chkRes=r||'none';R()}
function addPh(i){const d=S.d;S.err={};[...i.files].forEach(f=>{if(d.ph.length>=3)return;if(!/^image\/(jpeg|png)$/.test(f.type)||f.size>5e6)S.err.ph='Choose a JPG or PNG photo under 5 MB.';else d.ph.push(URL.createObjectURL(f))});R()}
function pin(ev){const b=ev.currentTarget.getBoundingClientRect();S.d.pin={x:Math.round((ev.clientX-b.left)/b.width*100),y:Math.round((ev.clientY-b.top)/b.height*100)};R()}
function sub(){const d=S.d;S.err={};if(d.type=='Missed collection'&&!d.date)S.err.date='Enter the date missed.';if(!d.pin)S.err.pin='Drop a pin on the map.';if(!d.desc.trim())S.err.desc='Describe the problem.';if(Object.keys(S.err).length)return R();
const r={ref:`KOL-2026-${String(++S.seq).padStart(3,'0')}`,b:S.brgy,type:d.type,dm:d.date,desc:d.desc.trim(),pin:d.pin,ph:d.ph,status:'Submitted',date:now(),upd:now(),ts:Date.now(),action:'',reason:''};S.rep.push(r);S.done=r;S.d=null;R()}
function saveS(){S.err={};S.sched[S.off].forEach((x,i)=>{if(x.type!='No collection'&&!x.route.trim())S.err['s'+i]='Enter the purok or zones for this route.'});if(Object.keys(S.err).length)return R();S.editing=false;tst('Schedule saved. Residents can see it now.')}
function post(){const t=$('#at').value.trim(),m=$('#am').value.trim();S.err={};if(!t)S.err.t='Enter a title.';if(!m)S.err.m='Enter a message.';if(Object.keys(S.err).length){R();$('#at').value=t;$('#am').value=m;return}S.ann.push({b:S.off,k:S.ak,title:t,msg:m,date:now(),ts:Date.now()});tst('Announcement posted.')}
function saveR(){const e=S.ed,r=S.rep.find(x=>x.ref==S.sel);S.err={};if(e.status!='Submitted'&&!e.action.trim())S.err.a='Record the action taken.';if(e.status=='Rejected'&&!e.reason.trim())S.err.r='Enter the reason.';if(Object.keys(S.err).length)return R();Object.assign(r,e,{upd:now(),ts:Date.now()});S.sel=null;tst('Status updated and posted to News.')}
const schedList=s=>s.map((x,i)=>`<div class="card row ${x.type=='No collection'?'dim':''}"><div><b>${D[i]}</b><div class="mut">${x.type=='No collection'?'—':E(x.route||'Route to be confirmed')+(x.time?', '+t12(x.time):'')}</div>${x.delay?`<div style="color:var(--amb);font-size:12px">Delayed: ${E(x.delay)}</div>`:''}</div><span class="pill ${pc(x.type)}">${x.type}</span></div>`).join('');
let snap=null;function startEdit(){snap=JSON.parse(JSON.stringify(S.sched[S.off]));S.editing=true;S.err={};R()}
function cancelEdit(){if(snap)S.sched[S.off]=snap;S.editing=false;S.err={};R()}
V.reps0=V.reps;V.res=V.home_;R();
</script></body></html>
