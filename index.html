<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kolekta</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{--bg:#f2f8ec;--card:#fff;--c2:#e4f1d8;--line:#cfe2c2;--lime:#2e7d32;--soft:#d9efc4;--btn:#3c8d3a;--tx:#17331b;--mut:#5d7a58;--amb:#a8650a;--red:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#dfead7;color:var(--tx);font:400 14px/1.45 Poppins,system-ui,sans-serif}
#app{width:360px;height:800px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;background:linear-gradient(180deg,#e3f3d3 0,#f2f8ec 40%,#f2f8ec 100%);display:flex;flex-direction:column;overflow:hidden;border-radius:44px;padding-top:44px;box-shadow:0 0 0 10px #fff,0 0 0 11px #bcd3ad,0 20px 50px rgba(40,90,40,.22)}
.body{flex:1;overflow-y:auto;padding:4px 18px 20px}header{padding:18px 18px 8px}h1{font-size:22px;margin:0;font-weight:600}h2{font-size:15px;margin:16px 0 8px;font-weight:600}header p,.mut{color:var(--mut);font-size:12px;margin:2px 0 0}
a{color:var(--lime);cursor:pointer;text-decoration:underline;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}.card.dim{opacity:.6}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:11px;font-weight:500;border-radius:20px;padding:2px 10px;background:var(--soft);color:#1f5a22;white-space:nowrap}.pill.n{background:#f8dfb0;color:#7a4a05}.pill.r{background:#dfe8da;color:#3d5a3a}.pill.x{background:#ecf1e8;color:var(--mut)}.pill.bad{background:#fbd3cc;color:#8a1c10}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{width:100%;background:var(--btn);color:#fff;border:0;border-radius:24px;padding:12px;font-weight:600;cursor:pointer;margin-top:10px}.btn:hover{background:#2f7a2e}.btn.alt{background:#fff;color:var(--lime);border:1px solid var(--line)}.btn.alt:hover{background:var(--c2)}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:12px;cursor:pointer}.seg button.on{background:var(--lime);border-color:var(--lime);color:#fff;font-weight:600}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 8px}textarea{resize:vertical;min-height:70px}
label{font-size:12px;font-weight:500}:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:14px}nav button{flex:1;background:none;border:0;padding:14px 2px;color:var(--mut);font-size:11px;cursor:pointer}nav button.on{color:var(--lime);font-weight:600}
.err{color:var(--red);font-size:12px;margin:-4px 0 8px}.back{background:var(--soft);color:#1f5a22;border:0;border-radius:20px;font-size:11px;font-weight:600;padding:3px 10px;margin:14px 18px 0;cursor:pointer;width:max-content}
.map{height:220px;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden}.leaflet-container{z-index:0;font:inherit}
.gmap{display:block;width:100%;height:250px;border:1px solid var(--line);border-radius:10px;background:var(--c2)}
.dot{position:absolute;width:18px;height:18px;background:var(--lime);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg)}
.ph{display:flex;gap:8px;margin:6px 0 10px}.ph>*{flex:1;aspect-ratio:1;border:1px dashed #9cc38a;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:12px;color:var(--mut);cursor:pointer;overflow:hidden;position:relative}.ph img{width:100%;height:100%;object-fit:cover}
.banner{background:var(--soft);border:1px solid #b9dd9c;color:#1f4d20;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:13px}
.toast{position:absolute;z-index:2000;left:18px;right:18px;bottom:70px;background:var(--lime);color:#fff;border-radius:12px;padding:10px 14px;font-weight:500;text-align:center;box-shadow:0 6px 18px rgba(30,80,30,.25)}
.hero{padding:70px 24px 24px}.hero.w{padding-top:200px}.em{font-size:1.25em;display:inline-block;vertical-align:middle;margin-left:8px;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}.hero h1{font-size:34px;letter-spacing:1px;color:#1f5a22}
.rm{width:38px;flex:none;height:40px;margin:4px 0 8px;background:var(--c2);border:0;border-radius:10px;cursor:pointer;color:var(--mut)}
.stop{display:flex;gap:10px;align-items:center;padding:8px 12px;margin-bottom:6px;background:#fff;border:1px solid var(--line);border-radius:10px}.stop i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:var(--lime);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.days button{flex:none;min-width:48px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}.days button.on{background:var(--lime);border-color:var(--lime);color:#fff;font-weight:600}
</style></head><body><div id="app"></div>

report:()=>{if(S.done){const r=S.done;return shell(RN,head('Report submitted','Thank you for helping keep our barangay clean')+`<div class="body"><div class="card"><div class="mut">Your reference number</div><h1 style="color:var(--lime)">${r.ref}</h1><div class="mut">${r.date}. Status: Submitted</div><p>Keep this number. Use it on the News page to check your report status.</p></div><button class="btn" onclick="S.done=null;R()">Done</button></div>`)}
const d=S.d||(S.d={type:'Missed collection',date:'',desc:'',pin:null,ph:[]}),m=d.type=='Missed collection';
return shell(RN,head('Report a problem','Help keep our barangay clean')+`<div class="body"><div class="seg"><button class="${m?'on':''}" onclick="S.d.type='Missed collection';R()">Missed Collection</button><button class="${m?'':'on'}" onclick="S.d.type='Clogged canal';R()">Clogged drainage</button></div><div class="mut" style="margin-bottom:6px">Reporting for Barangay ${S.brgy}. We save this barangay, your description, the pinned location and any photo. No name or contact number is collected.</div>${m?`<label for=dt>Date missed</label><input id=dt type=date value="${d.date}" oninput="S.d.date=this.value">${er('date')}`:''}<label>Photo evidence <span class=mut>(optional, up to 3, JPG or PNG, 5 MB each)</span></label><div class="ph">${[0,1,2].map(i=>d.ph[i]?`<div onclick="S.d.ph.splice(${i},1);R()" title="Remove photo"><img src="${d.ph[i]}" alt="Attached photo ${i+1}"></div>`:`<div onclick="$('#pf').click()">+ Add</div>`).join('')}</div><input id=pf type=file accept="image/jpeg,image/png" multiple hidden onchange="addPh(this)">${er('ph')}<label>Pin the location <span class=mut>(required)</span></label><div class="map" id="pinmap" role="application" aria-label="Map for pinning the location"></div><a style="font-size:12px" onclick="useLoc()">Use my current location</a><div class="mut" id="pintxt" style="margin:4px 0 8px">${d.pin?`Pinned at ${coords(d.pin)}. Tap the map or drag the pin to move it.`:'Tap the map to drop a pin'}</div><div id="pinerr">${er('pin')}</div><label for=ds>Description</label><textarea id=ds placeholder="What is the problem?" oninput="S.d.desc=this.value">${E(d.desc)}</textarea>${er('desc')}<button class="btn" onclick="sub()">Submit report</button></div>`)},
guide:()=>shell(RN,head('How to sort your garbage','Segregate before collection')+`<div class="body"><div class="banner"><b>No segregation, no collection</b><br>Unsorted garbage will not be collected.</div>${[['Biodegradable','Green bin','Food scraps, fruit and vegetable peels, leaves, grass, eggshells, paper',''],['Non-biodegradable','Black bin','Plastic wrappers, bottles, cans, styrofoam, glass, rubber, diapers','n'],['Residual','Gray bin','Items that cannot be recycled or composted, such as sanitary waste','r']].map(x=>`<div class="card"><div class="row"><b>${x[0]}</b><span class="pill ${x[3]}">${x[1]}</span></div><div class="mut">${x[2]}</div></div>`).join('')}<div class="card"><b>Quick tips</b><div class="mut">1. Keep separate bags.<br>2. Rinse containers before disposal.<br>3. Tie bags and set them out on your collection day.</div></div></div>`),
login:()=>`<button class="back" onclick="go('welcome')">BACK</button><div class="hero" style="padding-top:40px"><h1 style="font-size:24px">Barangay Official</h1><p class="mut">Sign in to manage Kolekta</p><div style="margin-top:30px"><label for=u>Username</label><input id=u autocomplete=username><label for=p>Password</label><input id=p type=password autocomplete=current-password>${er('login')}<button class="btn" onclick="login()">Log in</button><p class="mut" style="text-align:center;margin-top:12px">Authorized officials only</p></div></div>`,
sched:()=>{const s=S.sched[S.off];if(!S.editing)return shell(ON,head('Current schedule',`Barangay ${S.off}: set by the barangay`)+`<div class="body">${schedList(s)}<button class="btn" onclick="startEdit()">Edit schedule</button><button class="btn alt" onclick="S.rd=null;S.rs=1;S.tab='route';R()">View barangay map</button></div>`);return shell(ON,head('Set collection',`Barangay ${S.off}: weekly schedule, route and crew`)+`<div class="body">${s.map((x,i)=>`<div class="card"><b>${D[i]}</b><select aria-label="${D[i]} waste type" onchange="S.sched[S.off][${i}].type=this.value;keep()">${T.map(t=>`<option ${t==x.type?'selected':''}>${t}</option>`).join('')}</select><div class="row"><div style="flex:1"><label>Time (optional)</label><input type=time value="${x.time}" oninput="S.sched[S.off][${i}].time=this.value"></div><div style="flex:2"><label>Purok / zones</label><input value="${E(x.route)}" placeholder="In route order, e.g. Purok 1–3" oninput="S.sched[S.off][${i}].route=this.value"></div></div>${er('s'+i)}${x.type=='Collection'?asg(x,i):''}<label>Delay notice <span class=mut>(optional)</span></label><input value="${E(x.delay)}" placeholder="e.g. Truck delayed until 10:00 AM" oninput="S.sched[S.off][${i}].delay=this.value"></div>`).join('')}<button class="btn" onclick="saveS()">Save schedule</button><button class="btn alt" onclick="cancelEdit()">Cancel</button></div>`)},
ann:()=>shell(ON,head('Post announcement','Residents of your barangay are notified instantly')+`<div class="body"><div class="seg">${['Urgent','Notice','Reminder'].map(k=>`<button class="${S.ak==k?'on':''}" onclick="S.ak='${k}';R()">${k}</button>`).join('')}</div><label for=at>Title</label><input id=at placeholder="e.g. No collection today">${er('t')}<label for=am>Message</label><textarea id=am placeholder="e.g. Garbage truck broke down. Collection resumes tomorrow."></textarea>${er('m')}<button class="btn" onclick="post()">Post announcement</button><h2>Recent posts</h2>${S.ann.filter(x=>x.b==S.off).sort((a,b)=>b.ts-a.ts).map(x=>`<div class="card row"><span>${E(x.title)}</span><span class="mut">${x.date}</span></div>`).join('')}</div>`),
reps:()=>{const L=S.rep.filter(r=>r.b==S.off),r=L.find(x=>x.ref==S.sel);if(r){const e=S.ed;return`<button class="back" onclick="S.sel=null;R()">BACK</button>${head(r.ref,`${r.type}, ${r.date}`)}<div class="body"><div class="card">${r.type=='Missed collection'?`<div class="mut">Date missed: ${r.dm}</div>`:''}<p style="margin:6px 0">${E(r.desc)}</p>${gmapPin(r.pin)}<div class="mut">Pin: ${coords(r.pin)}</div>${r.ph.length?`<div class="ph">${r.ph.map(u=>`<div><img src="${u}" alt="Evidence photo"></div>`).join('')}</div>`:'<div class="mut">No photo attached</div>'}</div><label for=ac>Local action taken (or referral to the LGU, recorded here)</label><textarea id=ac oninput="S.ed.action=this.value">${E(e.action)}</textarea>${er('a')}<label for=st>Status</label><select id=st onchange="S.ed.status=this.value;R()">${ST.map(s=>`<option ${s==e.status?'selected':''}>${s}</option>`).join('')}</select>${e.status=='Rejected'?`<label for=rs>Reason for rejecting</label><input id=rs value="${E(e.reason)}" oninput="S.ed.reason=this.value">${er('r')}`:''}<button class="btn" onclick="saveR()">Update status</button></div>`}
return shell(ON,head('Citizen reports',`Barangay ${S.off}. Updates are shown to residents`)+`<div class="body"><div class="seg" style="flex-wrap:wrap">${['All',...ST].map(f=>`<button style="flex:none;padding:7px 10px" class="${S.filter==f?'on':''}" onclick="S.filter='${f}';R()">${f}</button>`).join('')}</div>${L.filter(x=>S.filter=='All'||x.status==S.filter).sort((a,b)=>b.ts-a.ts).map(x=>`<div class="card" style="cursor:pointer" onclick="openRep('${x.ref}')"><div class="row"><b>${x.type}</b><span class="pill ${x.status=='Rejected'?'bad':x.status=='Resolved'?'':'n'}">${x.status}</span></div><div class="mut">${x.ref}, ${x.date}</div></div>`).join('')||'<p class="mut">No reports to show.</p>'}</div>`)}};
function cont(){S.err={};if(!S.name.trim())S.err.name='Enter your name.';if(!S.brgy)S.err.brgy='Select your barangay.';if(Object.keys(S.err).length)return R();S.tab='home';S.screen='res';V.res=V.home;go('home_')}
V.home_=()=>V[S.tab]();
function login(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,b=B.find(b=>acc(b)==u);S.err={};
if(b&&S.locked[u])S.err.login='This account is blocked after 5 failed attempts. Contact the person who issued the account.';
else if(b){S.off=b;S.tab='sched';S.fails=0;return go('off_')}
else{if(b){S.fails=(S.fails||0)+1;if(S.fails>=5)S.locked[u]=1}S.err.login='Invalid username or password.'}R();$('#u').value=u}
V.off_=()=>V[S.tab]();
function chk(){const r=S.rep.find(x=>x.ref.toLowerCase()==S.chk.trim().toLowerCase());S.chkRes=r||'none';R()}
function addPh(i){const d=S.d;S.err={};[...i.files].forEach(f=>{if(d.ph.length>=3)return;if(!/^image\/(jpeg|png)$/.test(f.type)||f.size>5e6)S.err.ph='Choose a JPG or PNG photo under 5 MB.';else d.ph.push(URL.createObjectURL(f))});R()}
function sub(){const d=S.d;S.err={};if(d.type=='Missed collection'&&!d.date)S.err.date='Enter the date missed.';if(!d.pin)S.err.pin='Drop a pin on the map.';if(!d.desc.trim())S.err.desc='Describe the problem.';if(Object.keys(S.err).length)return R();
const r={ref:`KOL-2026-${String(++S.seq).padStart(3,'0')}`,b:S.brgy,type:d.type,dm:d.date,desc:d.desc.trim(),pin:d.pin,ph:d.ph,status:'Submitted',date:now(),upd:now(),ts:Date.now(),action:'',reason:''};S.rep.push(r);S.done=r;S.d=null;R()}
function saveS(){S.err={};const cur=S.sched[S.off];cur.forEach((x,i)=>{if(x.type=='No collection')return;if(!x.route.trim())S.err['s'+i]='Enter the purok or zones for this route.';const dv=x.drv.trim(),cr=x.crew.map(n=>n.trim()).filter(Boolean);if(!dv)return S.err['a'+i]='Enter the driver.';if(!cr.length)return S.err['a'+i]='Enter at least one crew member (up to 5).';const all=[dv,...cr];if(new Set(all.map(n=>n.toLowerCase())).size<all.length)return S.err['a'+i]='A person can only be listed once.';for(const o of B){if(o==S.off)continue;const y=S.sched[o][i];if(y.type!='Collection'||y.time!=x.time)continue;const oo=[y.drv,...y.crew].map(n=>n.trim().toLowerCase()),h=all.find(n=>oo.includes(n.toLowerCase()));if(h)return S.err['a'+i]=`${h} is already assigned in Barangay ${o} on ${D[i]}${x.time?' at '+t12(x.time):''}.`}});if(Object.keys(S.err).length)return R();cur.forEach(x=>{if(x.type=='Collection'){x.drv=x.drv.trim();const c=x.crew.map(n=>n.trim()).filter(Boolean);x.crew=c.length?c:['']}});S.editing=false;tst('Schedule saved. Residents can see it now.')}
function post(){const t=$('#at').value.trim(),m=$('#am').value.trim();S.err={};if(!t)S.err.t='Enter a title.';if(!m)S.err.m='Enter a message.';if(Object.keys(S.err).length){R();$('#at').value=t;$('#am').value=m;return}S.ann.push({b:S.off,k:S.ak,title:t,msg:m,date:now(),ts:Date.now()});tst('Announcement posted.')}
function saveR(){const e=S.ed,r=S.rep.find(x=>x.ref==S.sel);S.err={};if(e.status!='Submitted'&&!e.action.trim())S.err.a='Record the action taken.';if(e.status=='Rejected'&&!e.reason.trim())S.err.r='Enter the reason.';if(Object.keys(S.err).length)return R();Object.assign(r,e,{upd:now(),ts:Date.now()});S.sel=null;tst('Status updated and posted to News.')}
const schedList=s=>s.map((x,i)=>{const c=x.crew.map(n=>n.trim()).filter(Boolean);return`<div class="card row ${x.type=='No collection'?'dim':''}"><div><b>${D[i]}</b><div class="mut">${x.type=='No collection'?'—':E(x.route||'Route to be confirmed')+(x.time?', '+t12(x.time):'')}</div>${x.type=='Collection'?(x.drv.trim()?`<div class="mut">Driver: ${E(x.drv)}<br>Crew (${c.length}): ${E(c.join(', '))}</div>`:`<div style="color:var(--amb);font-size:12px">No driver or crew assigned yet</div>`):''}${x.delay?`<div style="color:var(--amb);font-size:12px">Delayed: ${E(x.delay)}</div>`:''}</div><span class="pill ${pc(x.type)}">${x.type}</span></div>`}).join('');
let snap=null;function startEdit(){snap=JSON.parse(JSON.stringify(S.sched[S.off]));S.editing=true;S.err={};R()}

const TRACE_TOOL=location.search.includes('trace'),BOUNDS={},TR={};let TRON=false;

const trB=()=>S.screen=='home_'?S.brgy:S.off;
function trDraw(){if(!PM||!PM.tl)return;const b=trB(),pts=TR[b]||[];PM.tl.clearLayers();if(pts.length>1)L.polygon(pts,{color:'#1b5e20',weight:3,fillColor:'#43a047',fillOpacity:.3}).addTo(PM.tl);pts.forEach(p=>L.circleMarker(p,{radius:4,color:'#1b5e20',fillColor:'#fff',fillOpacity:1,weight:2}).addTo(PM.tl));const t=$('#tpts');if(t)t.value=pts.length?`'${b}':${JSON.stringify(pts)},`:''}
function trToggle(){TRON=!TRON;const t=$('#trb');if(t)t.textContent=TRON?'Stop tracing':'Start tracing';if(PM)PM.el.style.cursor=TRON?'crosshair':''}
function trUndo(){const b=trB();(TR[b]||[]).pop();trDraw()}

let PM=null;

const same=(a,b)=>a[0]==b[0]&&a[1]==b[1];
function rings(ws){const out=[],pool=ws.map(w=>w.slice());while(pool.length){let cur=pool.shift(),moved=true;while(moved&&!same(cur[0],cur[cur.length-1])){moved=false;for(let i=0;i<pool.length;i++){const w=pool[i];if(same(cur[cur.length-1],w[0]))cur=cur.concat(w.slice(1));else if(same(cur[cur.length-1],w[w.length-1]))cur=cur.concat(w.slice(0,-1).reverse());else if(same(cur[0],w[w.length-1]))cur=w.slice(0,-1).concat(cur);else if(same(cur[0],w[0]))cur=w.slice(1).reverse().concat(cur);else continue;pool.splice(i,1);moved=true;break}}out.push(cur)}return out}
const rx=b=>b.replace(/-/g,'-?');
const fetchGeo=b=>fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&polygon_geojson=1&q='+gq(`Barangay ${b}, Iligan City, Philippines`)).then(r=>r.json()).catch(()=>[]).then(a=>{const r=a&&a[0],g={c:r?[+r.lat,+r.lon]:null,poly:r&&r.geojson&&/Polygon/.test(r.geojson.type)?r.geojson:null};if(g.poly)return g;
const q=`[out:json][timeout:25];area["name"~"^Iligan"]["boundary"="administrative"]->.c;rel(area.c)["boundary"="administrative"]["name"~"^(Barangay )?${rx(b)}",i];out geom;`;
return fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)}).then(r=>r.json()).then(j=>{const els=j.elements||[],re=new RegExp('^(Barangay )?'+rx(b)+'$','i'),rel=els.find(e=>re.test((e.tags||{}).name||''))||els[0];if(!rel)return g;const ws=(rel.members||[]).filter(m=>m.type=='way'&&m.role!='inner'&&m.geometry).map(m=>m.geometry.map(p=>[p.lat,p.lon]));if(!ws.length)return g;const rg=rings(ws);return{c:g.c||rg[0][0],poly:null,rings:rg}}).catch(()=>g)}).then(g=>S.geo[b]=g);

const el=document.getElementById('pinmap')||document.getElementById('bmap');PM=null;if(!el)return;if(!window.L){el.innerHTML='<div class="mut" style="padding:12px">The map could not load. Check your internet connection and try again.</div>';return}
TRON=false;const isB=el.id=='bmap',b=S.screen=='home_'?S.brgy:S.off,p=!isB&&S.d&&S.d.pin,g0=S.geo[b],map=L.map(el).setView(p?[p.lat,p.lng]:g0&&g0.c?g0.c:[8.228,124.245],p?18:g0&&g0.c?15:13);PM={map,mk:null,el};tl().addTo(map);
const show=g=>{const st={color:'#1b5e20',weight:3,fillColor:'#43a047',fillOpacity:isB?.35:.08};let l=null;if(BOUNDS[b])l=L.polygon(BOUNDS[b],st);else if(g&&g.rings)l=L.polygon(g.rings,st);else if(g&&g.poly)l=L.geoJSON(g.poly,{style:st});if(l){l.addTo(map);if(!p)map.fitBounds(l.getBounds())}else if(g&&g.c&&!p)map.setView(g.c,15)};
if(p)mark(p);if(!isB)map.on('click',e=>setPin(e.latlng));
